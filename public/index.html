<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダウトゲーム with ベッティング</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f8f7;
      color: #1a1a19;
      line-height: 1.6;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: #1a1a19;
        color: #ffffff;
      }
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    input[type="number"],
    input[type="text"] {
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const INITIAL_BANKROLL = 100;
    const MAX_BET = 100;
    const MAX_PLAYERS = 8;

    let db = null;
    const dbName = 'DoubtGameDB';
    const storeName = 'gameStates';

    function initIndexedDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open(dbName, 1);
        request.onsuccess = () => {
          db = request.result;
          resolve();
        };
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName);
          }
        };
        request.onerror = () => resolve();
      });
    }

    function saveToIndexedDB(key, data) {
      if (!db) return;
      const transaction = db.transaction([storeName], 'readwrite');
      const store = transaction.objectStore(storeName);
      store.put(data, key);
    }

    function saveGameState() {
      if (!game) return;
      const stateData = JSON.stringify(game);
      localStorage.setItem('doubt_gameState', stateData);
      saveToIndexedDB('lastGameState', stateData);
    }

    class GameState {
      constructor(roomCode) {
        this.roomCode = roomCode;
        this.gameState = 'lobby';
        this.playerId = null;
        this.playerName = '';
        this.players = {};
        this.playerList = [];
        this.isHost = false;
        this.hostId = null;
        
        // ゲーム進行用
        this.currentSpeakerIdx = 0;
        this.speakerClaim = null; // 話し手の主張（true=本当, false=嘘）
        this.bets = {}; // { playerId: amount }
        this.currentBetAmount = 0;
        this.revealed = false;
        this.message = '';
        this.odds = {}; // { playerId: oddsValue }
      }

      joinGame(name) {
        this.playerName = name;
        this.playerId = Math.random().toString(36).substring(7);
        this.players[this.playerId] = {
          id: this.playerId,
          name: name,
          bankroll: INITIAL_BANKROLL,
          status: 'active',
          earnings: 0
        };
        this.playerList = Object.values(this.players);
        localStorage.setItem('doubt_playerId', this.playerId);
        localStorage.setItem('doubt_playerName', name);
        localStorage.setItem('doubt_roomCode', this.roomCode);
        this.gameState = 'waiting';
        saveGameState();
      }

      startGame() {
        this.gameState = 'speaking';
        this.currentSpeakerIdx = 0;
        this.speakerClaim = null;
        this.bets = {};
        this.revealed = false;
        this.message = '';
        saveGameState();
        this.syncToServer();
      }
      
      async syncToServer() {
        try {
          await fetch(`/api/rooms/${this.roomCode}/update`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              gameState: this.gameState,
              players: this.players,
              currentSpeakerIdx: this.currentSpeakerIdx,
              speakerClaim: this.speakerClaim
            })
          });
        } catch (e) {
          console.error('Failed to sync to server:', e);
        }
      }

      setSpeakerClaim(isTruth) {
        this.speakerClaim = isTruth;
        this.gameState = 'talking';
        this.message = '';
        saveGameState();
        this.syncToServer();
      }

      setBet(amount) {
        if (amount > MAX_BET || amount < 1) return false;
        this.bets[this.playerId] = amount;
        this.currentBetAmount = amount;
        saveGameState();
        return true;
      }

      nextBetter() {
        const bettingPlayers = this.playerList.filter(p => p.id !== this.playerList[this.currentSpeakerIdx].id);
        const playersThatBet = bettingPlayers.filter(p => this.bets[p.id]);
        
        if (playersThatBet.length >= bettingPlayers.length) {
          this.gameState = 'revealing';
        }
        saveGameState();
        return true;
      }

      revealResult() {
        // ランダムに本当/嘘を決定
        const isActuallyTruth = Math.random() > 0.5;
        this.revealed = true;
        
        const currentSpeaker = this.playerList[this.currentSpeakerIdx];
        const isSpeakerCorrect = this.speakerClaim === isActuallyTruth;
        
        // オッズ計算
        const totalBet = Object.values(this.bets).reduce((a, b) => a + b, 0);
        const odds = {};
        Object.keys(this.bets).forEach(playerId => {
          const bet = this.bets[playerId];
          if (bet > 0) {
            odds[playerId] = Math.max(1.2, (totalBet / bet) * 0.5);
          }
        });
        
        // 配当計算
        this.playerList.forEach((p) => {
          if (p.id === currentSpeaker.id) {
            if (isSpeakerCorrect) {
              p.earnings += 50; // 話し手が正解で50ポイント
              p.bankroll += 50;
            } else {
              p.earnings -= 30; // 話し手が不正解で-30ポイント
              p.bankroll = Math.max(p.bankroll - 30, 0);
            }
          } else {
            const bet = this.bets[p.id] || 0;
            if (bet > 0) {
              // 正解判定：話し手の主張と実際の結果が一致したか
              const guessedCorrectly = (this.speakerClaim === isActuallyTruth);
              if (guessedCorrectly) {
                const payout = Math.round(bet * odds[p.id]);
                p.earnings += payout;
                p.bankroll += payout;
              } else {
                p.earnings -= bet;
                p.bankroll = Math.max(p.bankroll - bet, 0);
              }
            }
          }
        });
        
        this.message = isActuallyTruth ? '本当でした！' : 'ウソでした！';
        this.odds = odds;
        saveGameState();
      }

      nextSpeaker() {
        this.currentSpeakerIdx = (this.currentSpeakerIdx + 1) % this.playerList.length;
        
        // 全員が話し手になったらゲーム終了
        if (this.currentSpeakerIdx === 0) {
          this.gameState = 'gameover';
          return false;
        }
        
        this.speakerClaim = null;
        this.bets = {};
        this.revealed = false;
        this.message = '';
        this.gameState = 'speaking';
        saveGameState();
        return true;
      }
    }

    let game = null;

    async function createRoom() {
      try {
        const response = await fetch('/api/rooms/create', { method: 'POST' });
        const data = await response.json();
        return data.roomCode;
      } catch (e) {
        return null;
      }
    }

    async function verifyRoom(roomCode) {
      try {
        const response = await fetch(`/api/rooms/${roomCode}`);
        return response.ok;
      } catch (e) {
        return false;
      }
    }

    async function loadRoomState(roomCode) {
      try {
        const response = await fetch(`/api/rooms/${roomCode}/state`);
        if (!response.ok) return null;
        return await response.json();
      } catch (e) {
        return null;
      }
    }

    async function joinRoomAsPlayer(roomCode, playerName) {
      try {
        const response = await fetch(`/api/rooms/${roomCode}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playerName })
        });
        if (!response.ok) throw new Error('Failed to join');
        return await response.json();
      } catch (e) {
        return null;
      }
    }

    async function loadGameState() {
      const savedState = localStorage.getItem('doubt_gameState');
      if (savedState) {
        try {
          game = Object.assign(new GameState(''), JSON.parse(savedState));
          
          // ルームが存在するか確認
          const roomExists = await verifyRoom(game.roomCode);
          if (!roomExists) {
            // ルームが存在しない場合は初期化
            console.log('Room not found, clearing game state');
            localStorage.removeItem('doubt_gameState');
            game = null;
            return false;
          }
          
          return true;
        } catch (e) {
          console.error('Failed to load game state:', e);
          localStorage.removeItem('doubt_gameState');
          return false;
        }
      }
      return false;
    }

    function render() {
      const root = document.getElementById('root');
      root.innerHTML = '';
      
      try {
        if (!game) {
          renderRoomSelect(root);
        } else if (game.gameState === 'lobby') {
          renderLobby(root);
        } else if (game.gameState === 'waiting') {
          renderWaiting(root);
        } else if (game.gameState === 'speaking') {
          renderSpeaking(root);
        } else if (game.gameState === 'talking') {
          renderTalking(root);
        } else if (game.gameState === 'revealing') {
          renderBetting(root);
        } else if (game.gameState === 'result') {
          renderResult(root);
        } else if (game.gameState === 'gameover') {
          renderGameOver(root);
        } else {
          renderRoomSelect(root);
        }
      } catch (e) {
        console.error('Render error:', e);
        // エラーが発生した場合はゲーム状態をリセット
        game = null;
        localStorage.removeItem('doubt_gameState');
        root.innerHTML = '<div style="padding:2rem;text-align:center;"><p style="color:#dc3545;font-weight:600;">エラーが発生しました。ページをリロードしてください。</p></div>';
      }
    }

    function renderRoomSelect(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:700px;margin:0 auto;';
      div.innerHTML = `
        <h1 style="font-size:36px;font-weight:700;margin-bottom:2rem;text-align:center;">🎲 ダウトゲーム</h1>
        
        <div style="margin-bottom:2rem;padding:1.5rem;background:#e8f4f8;border-radius:12px;border-left:4px solid #2a78d6;">
          <h2 style="font-size:16px;font-weight:600;margin-bottom:1rem;color:#1f5cab;">📋 ゲームルール</h2>
          <ul style="margin:0;padding-left:1.5rem;color:#333;font-size:13px;line-height:1.8;">
            <li style="margin-bottom:0.5rem;"><strong>ゲーム形式:</strong> 全員が一度ずつ話し手になる（一巡で終了）</li>
            <li style="margin-bottom:0.5rem;"><strong>話し手の役割:</strong> 「本当」or「嘘」を設定 → トーク → 結果発表</li>
            <li style="margin-bottom:0.5rem;"><strong>参加者の役割:</strong> 話し手の主張が本当か嘘か予想して賭ける</li>
            <li style="margin-bottom:0.5rem;"><strong>賭け金:</strong> $1～$100 の間で自由に賭ける</li>
            <li style="margin-bottom:0.5rem;"><strong>配当:</strong> 正解時：ベット額×オッズ、不正解時：-ベット額</li>
            <li style="margin-bottom:0.5rem;"><strong>初期資金:</strong> 全プレイヤー $100 から開始</li>
            <li><strong>人数:</strong> 2～8人でプレイ可能</li>
          </ul>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <button id="createRoomBtn" style="padding:14px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:8px;cursor:pointer;">🆕 新規作成</button>
          <button id="joinRoomBtn" style="padding:14px;font-size:16px;font-weight:600;background:#28a745;color:white;border:none;border-radius:8px;cursor:pointer;">📌 ルームに参加</button>
        </div>
      `;
      root.appendChild(div);
      
      document.getElementById('createRoomBtn').addEventListener('click', async () => {
        localStorage.removeItem('doubt_gameState');
        const roomCode = await createRoom();
        if (roomCode) {
          game = new GameState(roomCode);
          game.isHost = true;
          saveGameState();
          render();
        } else {
          alert('ルーム作成に失敗しました');
        }
      });
      
      document.getElementById('joinRoomBtn').addEventListener('click', async () => {
        const roomCode = prompt('ルームコードを入力してください:')?.toUpperCase().trim();
        if (!roomCode) return;
        
        const exists = await verifyRoom(roomCode);
        if (!exists) {
          alert('そのルームコードは存在しません');
          return;
        }
        
        const playerName = prompt('プレイヤー名を入力してください:')?.trim();
        if (!playerName) return;
        
        const result = await joinRoomAsPlayer(roomCode, playerName);
        if (!result) {
          alert('ルームに参加できませんでした');
          return;
        }
        
        const roomState = await loadRoomState(roomCode);
        if (!roomState) {
          alert('ルーム状態の読み込みに失敗しました');
          return;
        }
        
        game = new GameState(roomCode);
        game.playerId = result.playerId;
        game.playerName = playerName;
        game.players = roomState.players;
        game.playerList = Object.values(roomState.players);
        game.gameState = 'waiting';
        game.isHost = result.isHost;
        game.hostId = result.hostId;
        
        saveGameState();
        render();
      });
    }

    function renderLobby(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:700px;margin:0 auto;';
      div.innerHTML = `
        <h1 style="font-size:36px;font-weight:700;margin-bottom:2rem;text-align:center;">🎲 ダウトゲーム</h1>
        
        <div style="margin-bottom:2rem;padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#666;">👤 プレイヤー名を入力</h3>
          <input type="text" id="playerNameInput" placeholder="あなたの名前" maxlength="20" style="width:100%;padding:12px;margin-bottom:1rem;font-size:16px;border-radius:8px;border:1px solid #ddd;"/>
          <button id="joinBtn" style="width:100%;padding:14px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:8px;cursor:pointer;">ゲームに参加 →</button>
        </div>
      `;
      root.appendChild(div);
      
      const input = document.getElementById('playerNameInput');
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('joinBtn').click();
      });
      
      document.getElementById('joinBtn').addEventListener('click', async () => {
        const name = input.value.trim();
        if (!name) {
          alert('名前を入力してください');
          return;
        }
        game.joinGame(name);
        
        const result = await joinRoomAsPlayer(game.roomCode, name);
        if (result) {
          game.playerId = result.playerId;
          game.isHost = result.isHost;
          game.hostId = result.hostId;
        }
        
        saveGameState();
        render();
      });
    }

    function renderWaiting(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      div.innerHTML = `
        <h1 style="font-size:28px;font-weight:600;margin-bottom:2rem;text-align:center;">🎲 ゲーム準備中</h1>
        
        <div style="margin-bottom:2rem;padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;">
          <p style="color:#666;margin:0 0 0.5rem 0;font-size:14px;">ルームコード</p>
          <div style="padding:1rem;background:#f8f8f7;border-radius:8px;text-align:center;">
            <p style="font-size:36px;font-weight:700;margin:0;letter-spacing:2px;color:#2a78d6;">${game.roomCode}</p>
            <p style="color:#999;margin:0.5rem 0 0 0;font-size:12px;">他のプレイヤーに共有してください</p>
          </div>
        </div>

        <div style="margin-bottom:2rem;padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#666;">参加プレイヤー (${Object.keys(game.players).length}/${MAX_PLAYERS})</h3>
          <div style="display:grid;gap:8px;">
            ${Object.values(game.players).map(p => `
              <div style="padding:12px;background:${p.id === game.playerId ? '#e3f2fd' : '#f8f8f7'};border-radius:8px;border:${p.id === game.playerId ? '2px solid #2a78d6' : '1px solid #e0e0e0'};">
                <span style="font-weight:${p.id === game.playerId ? '600' : '400'};color:${p.id === game.playerId ? '#1f5cab' : '#333'};">${p.name}${p.id === game.playerId ? ' (あなた)' : ''}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <button id="startGameBtn" style="padding:14px;font-size:16px;font-weight:600;background:${game.isHost && Object.keys(game.players).length >= 2 ? '#2a78d6' : '#ccc'};color:white;border:none;border-radius:8px;cursor:${game.isHost && Object.keys(game.players).length >= 2 ? 'pointer' : 'not-allowed'};opacity:${game.isHost && Object.keys(game.players).length >= 2 ? 1 : 0.5};" ${!game.isHost || Object.keys(game.players).length < 2 ? 'disabled' : ''}>ゲーム開始 →</button>
          <button id="leaveRoomBtn" style="padding:14px;font-size:16px;font-weight:600;background:#dc3545;color:white;border:none;border-radius:8px;cursor:pointer;">退出</button>
        </div>
        ${!game.isHost ? `<p style="text-align:center;color:#999;font-size:12px;margin-top:1rem;">💡 ホストがゲーム開始を待っています</p>` : ''}
      `;
      root.appendChild(div);
      
      document.getElementById('startGameBtn').addEventListener('click', () => {
        if (game.isHost) {
          game.startGame();
          render();
        }
      });
      
      document.getElementById('leaveRoomBtn').addEventListener('click', () => {
        if (confirm('ルームを退出しますか？')) {
          game = null;
          localStorage.removeItem('doubt_gameState');
          render();
        }
      });
      
      // 定期的にサーバーから状態を更新
      const updateInterval = setInterval(async () => {
        if (!game || game.gameState !== 'waiting') {
          clearInterval(updateInterval);
          return;
        }
        
        const roomState = await loadRoomState(game.roomCode);
        if (roomState) {
          game.players = roomState.players;
          game.playerList = Object.values(roomState.players);
          
          // ゲームが開始したかチェック
          if (roomState.gameState === 'speaking') {
            game.gameState = 'speaking';
            game.currentSpeakerIdx = roomState.currentSpeakerIdx || 0;
            game.speakerClaim = null;
            game.bets = {};
            game.revealed = false;
            saveGameState();
            clearInterval(updateInterval);
            render();
            return;
          }
          
          render();
        }
      }, 1000);
    }

    function renderSpeaking(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      
      const currentSpeaker = game.playerList[game.currentSpeakerIdx];
      const isYourTurn = game.playerId === currentSpeaker.id;
      
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
          <h1 style="font-size:28px;font-weight:600;margin:0;">🎤 話し手設定</h1>
          <button id="exitGameBtn" style="padding:8px 16px;font-size:12px;font-weight:600;background:#dc3545;color:white;border:none;border-radius:6px;cursor:pointer;">退出</button>
        </div>
        
        <div style="padding:1.5rem;background:#e8f4f8;border-radius:12px;margin-bottom:2rem;">
          <p style="font-size:16px;font-weight:600;text-align:center;color:#1f5cab;margin:0;">
            ${isYourTurn ? 'あなたが話し手です！' : `${currentSpeaker.name} が話し手です`}
          </p>
        </div>

        <div style="display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:2rem;">
          ${isYourTurn ? `
            <button id="claimTrueBtn" style="padding:20px;font-size:18px;font-weight:600;background:#d4edda;color:#155724;border:2px solid #28a745;border-radius:8px;cursor:pointer;">✓ 本当の話をします</button>
            <button id="claimFalseBtn" style="padding:20px;font-size:18px;font-weight:600;background:#f8d7da;color:#721c24;border:2px solid #dc3545;border-radius:8px;cursor:pointer;">✕ ウソの話をします</button>
          ` : `
            <p style="text-align:center;color:#999;">他のプレイヤーの選択をお待ちください...</p>
          `}
        </div>
      `;
      root.appendChild(div);
      
      document.getElementById('exitGameBtn').addEventListener('click', () => {
        if (confirm('ゲームを退出しますか？')) {
          game = null;
          localStorage.removeItem('doubt_gameState');
          render();
        }
      });
      
      if (isYourTurn) {
        document.getElementById('claimTrueBtn').addEventListener('click', () => {
          game.setSpeakerClaim(true);
          render();
        });
        
        document.getElementById('claimFalseBtn').addEventListener('click', () => {
          game.setSpeakerClaim(false);
          render();
        });
      } else {
        // 参加者：定期的にゲーム状態を更新
        const updateInterval = setInterval(async () => {
          if (!game || game.gameState !== 'speaking') {
            clearInterval(updateInterval);
            return;
          }
          
          const roomState = await loadRoomState(game.roomCode);
          if (roomState && roomState.speakerClaim !== null && game.speakerClaim === null) {
            game.speakerClaim = roomState.speakerClaim;
            game.gameState = roomState.gameState;
            render();
          }
        }, 500);
      }
    }

    function renderTalking(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      
      const currentSpeaker = game.playerList[game.currentSpeakerIdx];
      const isYourTurn = game.playerId === currentSpeaker.id;
      
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
          <h1 style="font-size:28px;font-weight:600;margin:0;">🎤 トーク中</h1>
          <button id="exitGameBtn" style="padding:8px 16px;font-size:12px;font-weight:600;background:#dc3545;color:white;border:none;border-radius:6px;cursor:pointer;">退出</button>
        </div>
        
        <div style="padding:1.5rem;background:#e8f4f8;border-radius:12px;margin-bottom:2rem;">
          <p style="font-size:14px;color:#999;margin:0 0 0.5rem 0;">話し手</p>
          <p style="font-size:20px;font-weight:600;text-align:center;color:#1f5cab;margin:0;">
            ${currentSpeaker.name}
          </p>
          <p style="font-size:12px;color:#999;margin:0.5rem 0 0 0;text-align:center;">
            ${game.speakerClaim ? '✓ 本当の話' : '✕ ウソの話'}
          </p>
        </div>

        <div style="padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:2rem;">
          <p style="color:#666;font-size:14px;line-height:1.8;">
            ${isYourTurn ? 
              'あなたの話を聞かせてください。他のプレイヤーが本当か嘘か当てようとします。準備ができたら下のボタンを押してください。' :
              `${currentSpeaker.name}がトークを開始するのを待っています...`
            }
          </p>
        </div>

        ${isYourTurn ? `
          <button id="finishTalkBtn" style="width:100%;padding:14px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:8px;cursor:pointer;">トーク終了 → 参加者がBET</button>
        ` : `
          <p style="text-align:center;color:#999;font-size:12px;">他のプレイヤーのトークが終わるのをお待ちください...</p>
        `}
      `;
      root.appendChild(div);
      
      document.getElementById('exitGameBtn').addEventListener('click', () => {
        if (confirm('ゲームを退出しますか？')) {
          game = null;
          localStorage.removeItem('doubt_gameState');
          render();
        }
      });
      
      if (isYourTurn) {
        document.getElementById('finishTalkBtn').addEventListener('click', () => {
          game.gameState = 'revealing';
          game.saveGameState();
          game.syncToServer();
          render();
        });
      } else {
        // 参加者：定期的にゲーム状態を更新
        const updateInterval = setInterval(async () => {
          if (!game || game.gameState !== 'talking') {
            clearInterval(updateInterval);
            return;
          }
          
          const roomState = await loadRoomState(game.roomCode);
          if (roomState && roomState.gameState !== 'talking') {
            game.gameState = roomState.gameState;
            render();
          }
        }, 500);
      }
    }

    function renderBetting(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      
      const currentSpeaker = game.playerList[game.currentSpeakerIdx];
      const isYourTurn = game.playerId === currentSpeaker.id;
      const playerNotBet = game.playerList.filter(p => p.id !== currentSpeaker.id && !game.bets[p.id]);
      
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
          <h1 style="font-size:28px;font-weight:600;margin:0;">💰 ベッティング</h1>
          <button id="exitGameBtn" style="padding:8px 16px;font-size:12px;font-weight:600;background:#dc3545;color:white;border:none;border-radius:6px;cursor:pointer;">退出</button>
        </div>
        
        <div style="padding:1.5rem;background:#e8f4f8;border-radius:12px;margin-bottom:2rem;">
          <p style="font-size:14px;color:#999;margin:0 0 0.5rem 0;">話し手</p>
          <p style="font-size:20px;font-weight:600;text-align:center;color:#1f5cab;margin:0;">
            ${currentSpeaker.name}
          </p>
        </div>

        <div style="padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:2rem;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#666;">現在のベット状況</h3>
          <div style="display:grid;gap:8px;">
            ${game.playerList.map(p => {
              if (p.id === currentSpeaker.id) return '';
              const hasBet = game.bets[p.id];
              return `
                <div style="padding:8px;background:${hasBet ? '#d4edda' : '#f8f8f7'};border-radius:6px;">
                  <span style="color:#999;font-size:12px;">${p.name}</span><br/>
                  <span style="font-weight:600;color:${hasBet ? '#28a745' : '#999'};">
                    ${hasBet ? `BET: $${game.bets[p.id]}` : '未ベット'}
                  </span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        ${isYourTurn ? `
          <p style="text-align:center;color:#999;font-size:12px;">他のプレイヤーがベットするのをお待ちください...</p>
        ` : playerNotBet.length > 0 ? `
          <div style="margin-bottom:2rem;">
            <p style="color:#1f5cab;margin:0 0 1rem 0;font-size:14px;">残高: $${game.players[game.playerId].bankroll}</p>
            <input type="number" id="betInput" min="1" max="${game.players[game.playerId].bankroll}" placeholder="ベット額" style="width:100%;padding:10px;margin-bottom:1rem;font-size:16px;border-radius:6px;border:1px solid #ddd;"/>
            <div style="display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;margin-bottom:1rem;">
              ${[10, 25, 50, 100].map(amt => `
                <button class="quick-bet" data-amount="${amt}" style="padding:8px;font-size:12px;font-weight:600;background:white;border:1px solid #2a78d6;color:#2a78d6;border-radius:6px;cursor:pointer;opacity:${amt > game.players[game.playerId].bankroll ? 0.5 : 1};" ${amt > game.players[game.playerId].bankroll ? 'disabled' : ''}>$${amt}</button>
              `).join('')}
            </div>
            <button id="submitBetBtn" style="width:100%;padding:12px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:6px;cursor:pointer;">ベット確定</button>
          </div>
        ` : `
          <p style="text-align:center;color:#999;font-size:12px;">全員のベットが完了しました。結果を発表します...</p>
          ${game.isHost ? `
            <button id="revealBtn" style="width:100%;padding:14px;font-size:16px;font-weight:600;background:#ffc107;color:#000;border:none;border-radius:8px;cursor:pointer;margin-top:1rem;">🎬 結果を発表</button>
          ` : `
            <p style="text-align:center;color:#999;font-size:12px;margin-top:1rem;">ホストが結果を発表するのをお待ちください...</p>
          `}
        `}
      `;
      root.appendChild(div);
      
      document.getElementById('exitGameBtn').addEventListener('click', () => {
        if (confirm('ゲームを退出しますか？')) {
          game = null;
          localStorage.removeItem('doubt_gameState');
          render();
        }
      });
      
      if (!isYourTurn && playerNotBet.length > 0) {
        document.querySelectorAll('.quick-bet').forEach(btn => {
          btn.addEventListener('click', () => {
            document.getElementById('betInput').value = btn.dataset.amount;
          });
        });
        
        document.getElementById('submitBetBtn').addEventListener('click', () => {
          const amount = Number(document.getElementById('betInput').value);
          if (game.setBet(amount)) {
            render();
          }
        });
      }
      
      if (playerNotBet.length === 0 && game.isHost) {
        document.getElementById('revealBtn').addEventListener('click', () => {
          game.revealResult();
          game.gameState = 'result';
          render();
        });
      } else if (playerNotBet.length === 0 && !game.isHost) {
        // 参加者：定期的にゲーム状態を更新
        const updateInterval = setInterval(async () => {
          if (!game || game.gameState !== 'revealing') {
            clearInterval(updateInterval);
            return;
          }
          
          const roomState = await loadRoomState(game.roomCode);
          if (roomState && roomState.gameState !== 'revealing') {
            game.gameState = roomState.gameState;
            render();
          }
        }, 500);
      }
    }

    function renderResult(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      
      const bgColor = game.revealed ? '#d4edda' : '#f8d7da';
      const textColor = game.revealed ? '#155724' : '#721c24';
      
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
          <h1 style="font-size:28px;font-weight:600;margin:0;">結果発表</h1>
          <button id="exitGameBtn" style="padding:8px 16px;font-size:12px;font-weight:600;background:#dc3545;color:white;border:none;border-radius:6px;cursor:pointer;">退出</button>
        </div>
        
        <div style="padding:20px;background:${bgColor};border:3px solid ${textColor === '#155724' ? '#28a745' : '#dc3545'};border-radius:8px;text-align:center;margin-bottom:2rem;">
          <h2 style="margin:0 0 12px 0;font-size:24px;font-weight:600;color:${textColor};">
            ${game.message}
          </h2>
        </div>

        <div style="padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:2rem;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#666;">プレイヤー情報</h3>
          <div style="display:grid;gap:8px;">
            ${game.playerList.map(p => {
              const bet = game.bets[p.id] || 0;
              const oddValue = game.odds[p.id];
              return `
                <div style="padding:12px;background:#f8f8f7;border-radius:6px;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                    <span style="font-weight:600;">${p.name}</span>
                    <span style="color:${p.earnings > 0 ? '#28a745' : p.earnings < 0 ? '#dc3545' : '#999'};font-weight:600;">
                      ${p.earnings > 0 ? '+' : ''}${p.earnings}
                    </span>
                  </div>
                  ${bet > 0 ? `
                    <div style="font-size:12px;color:#999;">
                      BET: $${bet} ${oddValue ? `× ${oddValue.toFixed(2)}` : ''}
                    </div>
                  ` : ''}
                  <span style="font-size:12px;color:#999;">残高: $${p.bankroll}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <button id="nextBtn" style="padding:14px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:8px;cursor:pointer;">次へ →</button>
          ${game.isHost ? `
            <button id="endGameBtn" style="padding:14px;font-size:16px;font-weight:600;background:#6c757d;color:white;border:none;border-radius:8px;cursor:pointer;">ゲーム終了</button>
          ` : ''}
        </div>
      `;
      root.appendChild(div);
      
      document.getElementById('exitGameBtn').addEventListener('click', () => {
        if (confirm('ゲームを退出しますか？')) {
          game = null;
          localStorage.removeItem('doubt_gameState');
          render();
        }
      });
      
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (!game.nextSpeaker()) {
          render();
        } else {
          render();
        }
      });
      
      if (game.isHost && document.getElementById('endGameBtn')) {
        document.getElementById('endGameBtn').addEventListener('click', () => {
          if (confirm('ゲームを終了しますか？')) {
            game.gameState = 'gameover';
            render();
          }
        });
      }
    }

    function renderGameOver(root) {
      const div = document.createElement('div');
      div.style.cssText = 'padding:2rem;max-width:600px;margin:0 auto;';
      
      const winner = [...game.playerList].sort((a, b) => b.bankroll - a.bankroll)[0];
      
      div.innerHTML = `
        <h1 style="font-size:36px;font-weight:700;margin-bottom:2rem;text-align:center;">🎉 ゲーム終了</h1>
        
        <div style="padding:1.5rem;background:#fff3cd;border:3px solid #ffc107;border-radius:12px;text-align:center;margin-bottom:2rem;">
          <p style="color:#999;margin:0 0 0.5rem 0;font-size:12px;">優勝者</p>
          <p style="font-size:28px;font-weight:700;margin:0;color:#1f5cab;">👑 ${winner.name}</p>
          <p style="color:#666;margin:0.5rem 0 0 0;font-size:14px;">最終資金: $${winner.bankroll}</p>
        </div>

        <div style="padding:1.5rem;background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:2rem;">
          <h3 style="font-size:14px;font-weight:600;margin-bottom:1rem;color:#666;">最終ランキング</h3>
          <div style="display:grid;gap:8px;">
            ${[...game.playerList]
              .sort((a, b) => b.bankroll - a.bankroll)
              .map((p, idx) => `
                <div style="padding:12px;background:#f8f8f7;border-radius:6px;">
                  <div style="display:flex;justify-content:space-between;">
                    <span style="font-weight:600;">
                      ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1 + '位'} 
                      ${p.name}
                    </span>
                    <span style="color:${p.bankroll > INITIAL_BANKROLL ? '#28a745' : p.bankroll < INITIAL_BANKROLL ? '#dc3545' : '#999'};font-weight:600;">
                      $${p.bankroll}
                    </span>
                  </div>
                </div>
              `).join('')}
          </div>
        </div>

        <button id="returnBtn" style="width:100%;padding:14px;font-size:16px;font-weight:600;background:#2a78d6;color:white;border:none;border-radius:8px;cursor:pointer;">ルームに戻る</button>
      `;
      root.appendChild(div);
      
      document.getElementById('returnBtn').addEventListener('click', () => {
        game = null;
        localStorage.removeItem('doubt_gameState');
        render();
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        saveGameState();
      }
    });

    window.addEventListener('beforeunload', (e) => {
      if (game && (game.gameState === 'speaking' || game.gameState === 'talking' || game.gameState === 'revealing')) {
        e.preventDefault();
        e.returnValue = 'ゲーム中です。本当にページを離れますか？';
      }
    });

    (async () => {
      await initIndexedDB();
      await loadGameState();
      render();
    })();
  </script>
</body>
</html>
